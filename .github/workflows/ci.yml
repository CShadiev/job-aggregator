name: CI Quality Gate

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

env:
  OPENAI_API_KEY: "mock-openai-key"
  DEEPINFRA_API_KEY: "mock-deepinfra-key"
  GROK_API_KEY: "mock-grok-key"
  APIFY_API_KEY: "mock-apify-key"
  MONGODB_HOST: "localhost"
  MONGODB_PORT: "27017"
  MONGODB_USER: "test"
  MONGODB_PASSWORD: "testpassword"
  MONGODB_DATABASE: "job_aggregator_test"
  MONGODB_TEST_DATABASE: "job_aggregator_test"
  S3_ENDPOINT_URL: "https://mock-s3.example.com"
  S3_ACCESS_KEY: "mock-s3-access-key"
  S3_SECRET_KEY: "mock-s3-secret-key"
  S3_REGION: "us-east-1"
  S3_BUCKET_NAME: "mock-bucket"
  AUTH0_DOMAIN: "test.auth0.com"
  AUTH0_CLIENT_ID: "mock-client-id"
  AUTH0_CLIENT_SECRET: "mock-client-secret"
  AUTH0_AUDIENCE: "https://test.auth0.com/api/v2/"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check code formatting (ruff format)
        run: uv run ruff format --check .

      - name: Lint codebase (ruff check)
        run: uv run ruff check .

      - name: Static type check (pyright)
        run: uv run pyright

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run pytest tests/unit

  test-integration:
    name: Integration Tests (MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: testpassword
          MONGO_INITDB_DATABASE: job_aggregator_test
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run MongoDB repository integration tests
        run: uv run pytest tests/integration/test_mongo_jobs_repo.py

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: job-aggregator:test
