apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "job-aggregator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix }}
      # Strips the path prefix before forwarding — the container never sees
      # "/api", it sees "/". FASTAPI_ROOT_PATH (api.env) is what tells
      # FastAPI the *external* path still has the prefix, for OpenAPI/docs
      # URLs and redirects. The two settings do different jobs; both are
      # required for the prefix to work end-to-end.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: {{ .Values.api.port }}
