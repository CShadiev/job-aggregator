[project]
name = "job-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "auth0-python>=5.6.0",
    "boto3>=1.43.9",
    "boto3-stubs[essential]>=1.43.18",
    "expiringdict>=1.2.2",
    "fastapi>=0.136.3",
    "fastapi-cli>=0.0.24",
    "fpdf2>=2.8.7",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.97.0",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.12,<4.17",
]

[project.scripts]
run-fit-assessment-benchmark = "scripts.run_fit_assessment_benchmark:main"
run-screening-benchmark = "scripts.run_screening_benchmark:main"
run-pipeline = "orchestration.runner:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "orchestration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "priced: involves a paid service call (e.g. Apify)",
]

[tool.fastapi]
entrypoint = "main:app"
