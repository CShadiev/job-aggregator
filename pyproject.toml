[project]
name = "job-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "auth0-python>=5.6.0",
    "boto3>=1.43.9",
    "boto3-stubs[essential]>=1.43.18",
    "expiringdict>=1.2.2",
    "fastapi>=0.136.3",
    "fastapi-cli>=0.0.24",
    "fpdf2>=2.8.7",
    "loguru>=0.7.3",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.97.0",
    "pymongo>=4.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "priced: involves a paid service call (e.g. Apify)",
]

[tool.fastapi]
entrypoint = "main:app"
