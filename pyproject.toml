[project]
name = "job-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "auth0-python>=5.6.0",
    "boto3>=1.43.9",
    "boto3-stubs[essential]>=1.43.18",
    "expiringdict>=1.2.2",
    "fastapi>=0.136.3",
    "fastapi-cli>=0.0.24",
    "fpdf2>=2.8.7",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "loguru>=0.7.3",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-instrumentation-aiohttp-client>=0.60b1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-instrumentation-pymongo>=0.60b1",
    "opentelemetry-sdk>=1.39.1",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.97.0",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.12,<4.17",
]

[project.scripts]
run-fit-assessment-benchmark = "scripts.run_fit_assessment_benchmark:main"
run-screening-benchmark = "scripts.run_screening_benchmark:main"
run-pipeline = "orchestration.runner:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "orchestration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "priced: involves a paid service call (e.g. Apify)",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "logs",
    "tmp",
    "react-app",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = [
    "agents",
    "api",
    "auth_service",
    "benchmarks",
    "collection_service",
    "config",
    "logger_provider",
    "models",
    "orchestration",
    "repository",
    "telemetry",
    "tools",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "logs",
    "tmp",
    "react-app",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
